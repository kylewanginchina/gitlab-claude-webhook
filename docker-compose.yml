services:
  gitlab-claude-webhook:
    build: .
    container_name: gitlab-claude-webhook
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_DEFAULT_PROVIDER=${AI_DEFAULT_PROVIDER:-claude}
      - CLAUDE_DEFAULT_MODEL=${CLAUDE_DEFAULT_MODEL:-claude-sonnet-4-20250514}
      - CLAUDE_REASONING_EFFORT=${CLAUDE_REASONING_EFFORT:-high}
      - CLAUDE_DEFAULT_TIMEOUT_MINUTES=${CLAUDE_DEFAULT_TIMEOUT_MINUTES:-30}
      - CODEX_DEFAULT_MODEL=${CODEX_DEFAULT_MODEL:-gpt-5.1-codex-max}
      - CODEX_REASONING_EFFORT=${CODEX_REASONING_EFFORT:-high}
      - CODEX_DEFAULT_TIMEOUT_MINUTES=${CODEX_DEFAULT_TIMEOUT_MINUTES:-30}
      - GITLAB_BASE_URL=${GITLAB_BASE_URL:-https://gitlab.com}
      - GITLAB_TOKEN=${GITLAB_TOKEN}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - WEBHOOK_TASK_CONCURRENCY=${WEBHOOK_TASK_CONCURRENCY:-2}
      - PORT=${PORT:-3000}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
      - WORK_DIR=/tmp/gitlab-claude-work
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - REVIEW_ENABLED=${REVIEW_ENABLED:-true}
      - REVIEW_DEFAULT_PROVIDER=${REVIEW_DEFAULT_PROVIDER:-claude-multipass}
      - REVIEW_MIN_CONFIDENCE=${REVIEW_MIN_CONFIDENCE:-80}
      - REVIEW_MAX_CANDIDATE_FINDINGS=${REVIEW_MAX_CANDIDATE_FINDINGS:-12}
      - REVIEW_MAX_FINAL_FINDINGS=${REVIEW_MAX_FINAL_FINDINGS:-8}
      - REVIEW_PASS_CONCURRENCY=${REVIEW_PASS_CONCURRENCY:-4}
      - REVIEW_SCORING_CONCURRENCY=${REVIEW_SCORING_CONCURRENCY:-4}
      - REVIEW_SKIP_DRAFT=${REVIEW_SKIP_DRAFT:-true}
      - REVIEW_SKIP_EXISTING_SHA=${REVIEW_SKIP_EXISTING_SHA:-true}
      - REVIEW_ALLOWED_COMMANDS=${REVIEW_ALLOWED_COMMANDS:-/code-review}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - webhook-work:/tmp/gitlab-claude-work
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${PORT:-3000}/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  webhook-work:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
