services:
  gitlab-claude-webhook:
    image: gitlab-claude-webhook-deepflow:latest
    build:
      context: .
      dockerfile: Dockerfile.deepflow
      args:
        DEBIAN_MIRROR: ${DEEPFLOW_DEBIAN_MIRROR:-https://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${DEEPFLOW_DEBIAN_SECURITY_MIRROR:-https://mirrors.aliyun.com/debian-security}
    environment:
      - DEEPFLOW_BUILD_TOOLS_ENABLED=true
      - GOPATH=/home/claude/go
      - GOCACHE=/home/claude/.cache/go-build
      - CARGO_HOME=/home/claude/.cargo
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - webhook-work:/tmp/gitlab-claude-work
      - deepflow-work:/tmp/deepflow-work
      - deepflow-cargo-registry:/home/claude/.cargo/registry
      - deepflow-cargo-git:/home/claude/.cargo/git
      - deepflow-go-cache:/home/claude/.cache/go-build
      - deepflow-go-mod-cache:/home/claude/go/pkg/mod
      - deepflow-npm-cache:/home/claude/.npm

volumes:
  deepflow-cargo-registry:
  deepflow-cargo-git:
  deepflow-go-cache:
  deepflow-go-mod-cache:
  deepflow-npm-cache:
  deepflow-work:
